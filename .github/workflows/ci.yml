name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npm run check

      - name: Build Application
        run: npm run build

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: lifeloop_test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create .env.test
        run: |
          cat << 'EOF' > .env.test
          NODE_ENV=test
          TEST_DATABASE_URL=postgres://postgres:password@127.0.0.1:5433/lifeloop_test_db
          DISABLE_RATE_LIMIT=1
          AI_PROVIDER=mock
          EMAIL_PROVIDER=mock
          JWT_SECRET=test-jwt-secret-key-for-tests-only
          NO_PROXY=*
          no_proxy=*
          EOF

      - name: Run Vitest Suite
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgres://postgres:password@127.0.0.1:5433/lifeloop_test_db
          JWT_SECRET: test-jwt-secret-key-for-tests-only
          DISABLE_RATE_LIMIT: "1"
          AI_PROVIDER: mock
          EMAIL_PROVIDER: mock
          NO_PROXY: "*"
        run: npm test

  e2e:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    needs: [typecheck-and-build, test]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: lifeloop_test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create .env.test
        run: |
          cat << 'EOF' > .env.test
          NODE_ENV=test
          TEST_DATABASE_URL=postgres://postgres:password@127.0.0.1:5433/lifeloop_test_db
          DISABLE_RATE_LIMIT=1
          AI_PROVIDER=mock
          EMAIL_PROVIDER=mock
          JWT_SECRET=test-jwt-secret-key-for-tests-only
          NO_PROXY=*
          no_proxy=*
          EOF

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright Tests
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgres://postgres:password@127.0.0.1:5433/lifeloop_test_db
          JWT_SECRET: test-jwt-secret-key-for-tests-only
          DISABLE_RATE_LIMIT: "1"
          AI_PROVIDER: mock
          EMAIL_PROVIDER: mock
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
